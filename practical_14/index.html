<!DOCTYPE html>
<html>
<head><title>Greeting Message</title></head>
<body>
    <h1 id="greeting"></h1>
    <script>
        let hour = new Date().getHours();
        let msg = "";
        
        if (hour < 12) {
            msg = "Good Morning";
        } else if (hour < 17) {
            msg = "Good Afternoon";
        } else {
            msg = "Good Evening";
        }
        
        document.getElementById("greeting").innerText = msg;
    </script>
</body>
</html>
