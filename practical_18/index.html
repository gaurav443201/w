<!DOCTYPE html>
<html>
<head><title>Current Date and Time</title></head>
<body>
    <div id="datetime"></div>
    <script>
        let d = new Date();
        let dateStr = d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear();
        let timeStr = d.getHours() + ":" + d.getMinutes() + ":" + d.getSeconds();
        document.getElementById("datetime").innerText = dateStr + " " + timeStr;
    </script>
</body>
</html>
